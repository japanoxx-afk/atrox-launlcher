name: Build and release launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build
        shell: pwsh
        run: ./build.ps1
      - name: Run verification
        shell: pwsh
        run: |
          ./tests/verify.ps1
          ./tests/verify-replay.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AtroxLauncher
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/AtroxLauncher.exe dist/AtroxLauncher.exe.sha256 --title "AtroxLauncher ${{ github.ref_name }}" --generate-notes
